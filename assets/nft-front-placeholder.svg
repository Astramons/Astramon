    <circle cx="0" cy="-14" r="124" fill="#ffe15b" stroke="#1c2738" stroke-width="13"/>
    <path d="M-118-28c46-92 190-88 232 6-40 34-76 49-116 49-41 0-78-17-116-55z" fill="#fff5a5"/>
