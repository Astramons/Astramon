<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 868 1212" role="img" aria-labelledby="title desc">
  <title id="title">Astramon front card placeholder</title>
  <desc id="desc">A bright front-facing Astramon card placeholder used when a remote NFT image is unavailable.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ad"/>
      <stop offset="0.48" stop-color="#ffe46b"/>
      <stop offset="1" stop-color="#f4c84e"/>
    </linearGradient>
    <linearGradient id="artBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff6ff"/>
      <stop offset="0.52" stop-color="#8ed1ee"/>
      <stop offset="1" stop-color="#6edc73"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16334d" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="868" height="1212" rx="58" fill="#d9d9d0"/>
