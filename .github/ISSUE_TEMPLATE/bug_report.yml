name: Bug Report
description: Report a reproducible Astramon issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: List exact steps and the page URL.
      placeholder: "1. Go to...\n2. Click...\n3. See..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: input
    id: wallet
    attributes:
      label: Wallet
      description: Wallet app and browser, if relevant.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots Or Recording
      description: Add screenshots or recordings for UI issues.
